plugins {
  id 'java-library'
  id 'groovy'
  id 'jacoco'
  id 'checkstyle'
  id 'maven-publish'
  id 'com.adarshr.test-logger' version '4.0.0'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

// Minimum Java version the published library supports
def minJava = 17

tasks.withType(JavaCompile).configureEach {
  options.release = minJava
}

tasks.withType(GroovyCompile).configureEach {
  sourceCompatibility = "$minJava"
  targetCompatibility = "$minJava"
}

repositories {
  mavenCentral()
  mavenLocal()
}

configurations {
  mockitoAgent
}

dependencies {
  // RETROFIT
  api 'com.squareup.retrofit2:retrofit:3.0.0'

  // JACKSON (3.x keeps jackson-annotations on the 2.x line; the BOM pins the matching version)
  api platform('tools.jackson:jackson-bom:3.2.3')
  api 'tools.jackson.core:jackson-core'
  api 'tools.jackson.core:jackson-databind'
  api 'com.fasterxml.jackson.core:jackson-annotations'

  // COMMON
  annotationProcessor 'org.projectlombok:lombok:1.18.48'
  compileOnly 'org.projectlombok:lombok:1.18.48'
  api 'io.vavr:vavr:1.0.1'
  implementation 'org.slf4j:slf4j-api:2.0.20'
  api 'org.apache.commons:commons-lang3:3.21.0'
  api 'com.squareup.okhttp3:logging-interceptor:5.5.0'

  // LOGGING
  testRuntimeOnly 'ch.qos.logback:logback-classic:1.6.5'

  // TEST
  testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'
  testCompileOnly 'org.projectlombok:lombok:1.18.48'
  testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
  testImplementation 'com.tngtech.archunit:archunit-junit5-api:1.5.1'
  testRuntimeOnly 'com.tngtech.archunit:archunit-junit5-engine:1.5.1'
  testImplementation 'org.skyscreamer:jsonassert:1.5.3'
  testImplementation 'org.mockito:mockito-core:5.24.0'
  mockitoAgent('org.mockito:mockito-core:5.24.0') {
    transitive = false
  }
  testImplementation 'org.wiremock:wiremock:4.0.0-beta.40'
  testImplementation 'org.apache.groovy:groovy:4.0.33'
  testImplementation 'org.spockframework:spock-core:2.5-groovy-4.0'
}

base {
  archivesName = 'lifx-client'
}

jacoco {
  toolVersion = '0.8.15'
}

jacocoTestReport {
  // Run after, not depend on, the tests: a failing test must not skip the report
  mustRunAfter tasks.withType(Test)
  executionData tasks.withType(Test)
  reports {
    xml.required = true
    csv.required = false
    html.required = true
    html.outputLocation = layout.buildDirectory.dir('reports/jacocoHtml')
  }
}

task spockTest(type: Test, description: 'Runs tests written in Spock.', group: LifecycleBasePlugin.VERIFICATION_GROUP) {
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform {
    includeEngines 'spock'
  }
}

check.dependsOn spockTest

test {
  useJUnitPlatform {
    includeEngines 'junit-jupiter', 'archunit'
  }
  // Exclude integration tests
  exclude '**/*IntegrationTest*'
}

// JVM that runs the tests: ./gradlew check -PtestJavaVersion=17
def testJava = providers.gradleProperty('testJavaVersion').map { it as int }.getOrElse(25)

tasks.withType(Test).configureEach {
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(testJava)
  }
  // Load Mockito's inline mock maker as an agent instead of self-attaching (JEP 451)
  jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
  finalizedBy jacocoTestReport
}

// CHECKSTYLE

checkstyle {
  toolVersion = '14.3.0'
}

checkstyleMain.source = "src/main/java"
checkstyleTest.source = "src/test/java"

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
    }
  }
}
