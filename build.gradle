import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
  id 'java-library'
  id 'groovy'
  id 'jacoco'
  id 'checkstyle'
  id 'maven-publish'
  alias(libs.plugins.test.logger)
  alias(libs.plugins.errorprone)
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}

// Minimum Java version the published library supports
def minJava = 17

tasks.withType(JavaCompile).configureEach {
  options.release = minJava
  // -processing: the annotations of Retrofit, Jackson and JSpecify are read at runtime or by Error Prone, so no
  // annotation processor claims them, and javac would warn about every one of them
  options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-processing', '-Werror'])
}

tasks.named('compileJava', JavaCompile) {
  options.errorprone {
    disableWarningsInGeneratedCode = true
    check('NullAway', CheckSeverity.ERROR)
    // Only code in @NullMarked scopes is checked
    option('NullAway:OnlyNullMarked', 'true')
    option('NullAway:JSpecifyMode', 'true')
  }
}

// Error Prone stays on for tests, but NullAway is main-code only
tasks.named('compileTestJava', JavaCompile) {
  options.errorprone {
    check('NullAway', CheckSeverity.OFF)
  }
}

tasks.withType(GroovyCompile).configureEach {
  sourceCompatibility = "$minJava"
  targetCompatibility = "$minJava"
}

repositories {
  mavenCentral()
}

configurations {
  mockitoAgent
}

dependencies {
  // RETROFIT
  api libs.retrofit

  // JACKSON (3.x keeps jackson-annotations on the 2.x line; the BOM pins the matching version)
  api platform(libs.jackson.bom)
  api libs.jackson.core
  api libs.jackson.databind
  api libs.jackson.annotations

  // COMMON
  annotationProcessor libs.lombok
  compileOnly libs.lombok
  api libs.vavr
  api libs.jspecify
  implementation libs.slf4j.api
  implementation libs.logging.interceptor

  // STATIC ANALYSIS
  errorprone libs.errorprone.core
  errorprone libs.nullaway

  // LOGGING
  testRuntimeOnly libs.logback.classic

  // TEST
  testImplementation platform(libs.junit.bom)
  testAnnotationProcessor libs.lombok
  testCompileOnly libs.lombok
  testImplementation libs.junit.jupiter
  testRuntimeOnly libs.junit.platform.launcher
  testImplementation libs.archunit.api
  testRuntimeOnly libs.archunit.engine
  testImplementation libs.jsonassert
  testImplementation libs.mockito.core
  mockitoAgent(libs.mockito.core) {
    transitive = false
  }
  testImplementation libs.wiremock
  testImplementation libs.groovy
  testImplementation libs.spock.core
}

base {
  archivesName = 'lifx-client'
}

jacoco {
  toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport', JacocoReport) {
  // Run after, not depend on, the tests: a failing test must not skip the report
  mustRunAfter tasks.withType(Test)
  // Test tasks are named, not collected: a TaskCollection would be iterated eagerly while the task graph is built
  executionData tasks.named('test').get(), tasks.named('spockTest').get()
  reports {
    xml.required = true
    csv.required = false
    html.required = true
    html.outputLocation = layout.buildDirectory.dir('reports/jacocoHtml')
  }
}

tasks.register('spockTest', Test) {
  description = 'Runs tests written in Spock.'
  group = LifecycleBasePlugin.VERIFICATION_GROUP
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform {
    includeEngines 'spock'
  }
}

tasks.named('check') {
  dependsOn tasks.named('spockTest')
}

tasks.named('test', Test) {
  useJUnitPlatform {
    includeEngines 'junit-jupiter', 'archunit'
  }
  // Exclude integration tests
  exclude '**/*IntegrationTest*'
}

// JVM that runs the tests: ./gradlew check -PtestJavaVersion=17
def testJava = providers.gradleProperty('testJavaVersion').map { it as int }.getOrElse(25)

def mockitoAgentFiles = configurations.mockitoAgent

tasks.withType(Test).configureEach {
  javaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(testJava)
  }
  // Load Mockito's inline mock maker as an agent instead of self-attaching (JEP 451)
  // The configuration is captured outside the closure and resolved only when the arguments are needed
  jvmArgumentProviders.add(new CommandLineArgumentProvider() {
    /**
     * Supplies the JVM argument that loads Mockito's agent for tests.
     */
    @Override
    Iterable<String> asArguments() {
      ["-javaagent:${mockitoAgentFiles.asPath}".toString()]
    }
  })
  finalizedBy tasks.named('jacocoTestReport')
}

// CHECKSTYLE

checkstyle {
  toolVersion = '14.3.0'
}

checkstyleMain.source = "src/main/java"
checkstyleTest.source = "src/test/java"

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
    }
  }
}
