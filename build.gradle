plugins {
  id 'java-library'
  id 'groovy'
  id 'jacoco'
  id 'checkstyle'
  id 'maven-publish'
  id 'com.adarshr.test-logger' version '4.0.0'
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(14)
  }
}

repositories {
  mavenCentral()
  mavenLocal()
}

dependencies {
  // RETROFIT
  api 'com.squareup.retrofit2:retrofit:2.8.1'
  api 'com.squareup.retrofit2:converter-jackson:2.8.1'

  // JACKSON
  api 'com.fasterxml.jackson.core:jackson-core:2.10.0'
  api 'com.fasterxml.jackson.core:jackson-databind:2.10.0'
  api 'com.fasterxml.jackson.core:jackson-annotations:2.10.0'
  api 'com.fasterxml.jackson.module:jackson-module-parameter-names:2.10.0'
  api 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.10.0'
  api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.10.0'

  // COMMON
  annotationProcessor 'org.projectlombok:lombok:1.18.12'
  compileOnly 'org.projectlombok:lombok:1.18.12'
  api 'io.vavr:vavr:0.10.0'
  api 'org.slf4j:slf4j-api:1.7.25'
  api 'org.apache.commons:commons-lang3:3.7'
  api 'com.squareup.okhttp3:logging-interceptor:3.10.0'

  // LOGGING
  api 'ch.qos.logback:logback-classic:1.6.5'

  // TEST
  testAnnotationProcessor 'org.projectlombok:lombok:1.18.12'
  testCompileOnly 'org.projectlombok:lombok:1.18.12'
  testImplementation 'org.junit.jupiter:junit-jupiter:5.5.2'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.5.2'
  testImplementation 'com.tngtech.archunit:archunit-junit5-api:0.12.0'
  testRuntimeOnly 'com.tngtech.archunit:archunit-junit5-engine:0.12.0'
  testImplementation 'org.skyscreamer:jsonassert:1.5.0'
  testImplementation 'org.mockito:mockito-core:2.23.4'
  testImplementation 'com.github.tomakehurst:wiremock:2.18.0'
  testImplementation 'org.codehaus.groovy:groovy-all:2.4.15'
  testImplementation 'org.spockframework:spock-core:1.2-groovy-2.4'
  testRuntimeOnly 'net.bytebuddy:byte-buddy:1.8.21'
}

base {
  archivesName = 'lifx-client'
}

jacocoTestReport {
  // Run after, not depend on, the tests: a failing test must not skip the report
  mustRunAfter tasks.withType(Test)
  executionData tasks.withType(Test)
  reports {
    xml.required = true
    csv.required = false
    html.required = true
    html.outputLocation = file("${buildDir}/reports/jacocoHtml")
  }
}

task spockTest(type: Test, description: 'Runs tests written in Spock.', group: LifecycleBasePlugin.VERIFICATION_GROUP) {
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnit()
}

check.dependsOn spockTest

test {
  useJUnitPlatform()
  // Exclude integration tests
  exclude '**/*IntegrationTest*'
}

tasks.withType(Test).configureEach { finalizedBy jacocoTestReport }

// CHECKSTYLE

checkstyle {
  toolVersion = '8.27'
}

checkstyleMain.source = "src/main/java"
checkstyleTest.source = "src/test/java"

publishing {
  publications {
    maven(MavenPublication) {
      from components.java
    }
  }
}
