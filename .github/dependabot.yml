version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  # Dependencies and plugins in build.gradle and settings.gradle, and the Gradle wrapper
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    # Propose new releases only once they are a week old; security updates are not delayed
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - java
    # Gradle doesn't support prefix-development, so every pull request is `build(deps): ...`
    commit-message:
      prefix: build
      include: scope
    # A dependency joins the first group it matches, so the per-family major groups come before the catch-all
    groups:
      jackson:
        patterns:
          - 'tools.jackson*'
          # jackson-annotations stays on the 2.x group id in Jackson 3
          - 'com.fasterxml.jackson*'
        update-types:
          - major
      retrofit:
        patterns:
          - 'com.squareup.retrofit2:*'
        update-types:
          - major
      okhttp:
        patterns:
          - 'com.squareup.okhttp3:*'
        update-types:
          - major
      junit:
        patterns:
          - 'org.junit*'
        update-types:
          - major
      archunit:
        patterns:
          - 'com.tngtech.archunit:*'
        update-types:
          - major
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # Each Spock version names its Groovy line (2.5-groovy-4.0), so Dependabot could propose another line's variant.
      # Remove when Spock and Groovy are upgraded together to the next Groovy line.
      - dependency-name: 'org.spockframework:*'
      # Groovy must match Spock's groovy-4.0 variant, so only 4.0.x patch updates are safe.
      # Remove when Spock and Groovy are upgraded together to the next Groovy line.
      - dependency-name: 'org.apache.groovy:*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
