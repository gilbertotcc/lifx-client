name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (tests on JDK ${{ matrix.test-java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The library is compiled with the JDK 25 toolchain for --release 17, so tests run on the oldest and newest JDK
        test-java: [17, 25]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Set up the test JDK and JDK 25 for Gradle and the toolchain
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          # The last JDK listed becomes the default, so Gradle runs on 25
          java-version: |
            ${{ matrix.test-java }}
            25
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
      - name: Run checks
        run: ./gradlew check --continue -PtestJavaVersion=${{ matrix.test-java }}
      - name: Report test results
        if: always()
        uses: mikepenz/action-junit-report@v6.6.1
        with:
          report_paths: build/test-results/**/TEST-*.xml
          annotate_only: true
          detailed_summary: true
          include_passed: false
          fail_on_failure: false
          require_tests: true
      - name: Report code coverage
        # Coverage is the same on every leg, so comment from one only
        if: always() && github.event_name == 'pull_request' && matrix.test-java == 25
        continue-on-error: true
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Code coverage
          min-coverage-overall: 80
          min-coverage-changed-files: 80
          update-comment: true
          # Fork pull requests get a read-only token, so they can't comment.
          comment-type: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'both' || 'summary' }}
