# Check URLs in Markdown files only. Paths ignored by .gitignore are skipped by default.
extensions = ["md"]

# The caveman-commit agent skill (installed with skills.sh) is third-party content.
exclude_path = ["(^|/)\\.claude/skills/caveman-commit/"]

# Keep slow hosts from making the check flaky.
timeout = 30
max_retries = 2
max_concurrency = 10
