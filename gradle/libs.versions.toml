[versions]
retrofit = "3.0.0"
# Jackson 3.x keeps jackson-annotations on the 2.x line; the BOM pins the matching version
jackson-bom = "3.2.4"
lombok = "1.18.48"
vavr = "1.0.1"
slf4j = "2.0.20"
okhttp = "5.5.0"
jspecify = "1.0.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
jacoco = "0.8.15"
checkstyle = "14.3.0"
logback = "1.6.5"
junit-bom = "6.1.3"
archunit = "1.5.1"
jsonassert = "1.5.3"
mockito = "5.24.0"
# 4.0.0-beta is used on purpose: WireMock 3.13.2 pulls handlebars 4.3.1 (GHSA-r4gv-qr8j-p3pg) and Jetty 11
# (GHSA-qh8g-58pp-2wxh, fixed only in Jetty 12). Move to 4.x GA once released.
wiremock = "4.0.0-beta.40"
groovy = "5.0.8"
spock = "2.5-groovy-5.0"
test-logger = "4.0.0"
errorprone-plugin = "5.1.1"

[libraries]
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
# Jackson 3.x keeps jackson-annotations on the 2.x line; the BOM pins the matching version
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson-bom" }
jackson-core = { module = "tools.jackson.core:jackson-core" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
vavr = { module = "io.vavr:vavr", version.ref = "vavr" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
# Tool versions are read through libs.versions.* (toolVersion); these entries let Dependabot track them
jacoco-agent = { module = "org.jacoco:org.jacoco.agent", version.ref = "jacoco" }
checkstyle = { module = "com.puppycrawl.tools:checkstyle", version.ref = "checkstyle" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
archunit-api = { module = "com.tngtech.archunit:archunit-junit5-api", version.ref = "archunit" }
archunit-engine = { module = "com.tngtech.archunit:archunit-junit5-engine", version.ref = "archunit" }
jsonassert = { module = "org.skyscreamer:jsonassert", version.ref = "jsonassert" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }
groovy = { module = "org.apache.groovy:groovy", version.ref = "groovy" }
spock-core = { module = "org.spockframework:spock-core", version.ref = "spock" }

[plugins]
test-logger = { id = "com.adarshr.test-logger", version.ref = "test-logger" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
